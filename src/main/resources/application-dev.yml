spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:support_orders}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:dev_password_123}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # En dev es cómodo, pero ver nota en prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true