version: '3.9'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: support-orders-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-support_orders}
      POSTGRES_USER: ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app_user} -d ${DB_NAME:-support_orders}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: